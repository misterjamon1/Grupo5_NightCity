<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Night City</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 style="text-align: center; font-size: 48px; color: green;">Night City</h1>
    <h2 style="text-align: center; font-size: 32px; color: aqua;"><em>La ciudad de los sueños</em></h2>
    <header>
        <nav>
            <ul>
                <li><a href="./index.html">Inicio</a></li>
                <li><a href="./Lugares.html">Lugares</a></li>
                <li><a href="./Ciudad.html">Ciudad</a></li>
                <li>Contacto</li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Solicitá tu viaje a Night City</h2>
        <form action="#" method="post">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre y apellido" required>
            <br>
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="tu@correo.com" required>
            <br>
            <label for="fecha">Fecha de viaje</label>
            <input type="date" id="fecha" name="fecha">
            <br>
            <label for="personas">Cantidad de pasajeros</label>
            <input type="number" id="personas" name="personas" min="1">
            <br>
            <label for="distrito">Distrito que querés visitar</label>
            <select name="distrito" id="distrito" required>
                <option value="">Elegí un distrito</option>
                <option value="watson">Watson</option>
                <option value="westbrook">Westbrook</option>
                <option value="heywood">Heywood</option>
                <option value="pacifica">Pacifica</option>
            </select>
            <br>
            <label for="mensaje">Dejanos tu consulta</label>
            <textarea name="mensaje" id="mensaje" rows="4" placeholder="Contanos qué te gustaría conocer de Night City"></textarea>
            <br>
            <button type="submit">Enviar solicitud</button>
        </form>
    </main>
</body>
</html>
