<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Night City</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
          <div class="container-fluid">
              <div class="logo">
                <a href="./index.html">
                  <img src="./img/night-city-logo.png" alt="Logo de Night City" id="logo">
                </a>
              </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarText">
              <ul class="navbar-nav me-auto mb-2 mb-lg-0 menu">
                <li class="nav-item">
                    <a class="links" href="./index.html">Inicio</a>
                </li>
                <li class="nav-item">
                  <a class="links" href="./Lugares.html">Lugares</a>
                </li>
                <li class="nav-item">
                  <a class="links" href="./Ciudad.html">Ciudad</a>
                </li>
                <li class="link-no-activo">
                  Contacto
                </li>
              </ul>
            </div>
          </div>
        </nav>
    </header>
        <main>
            <h2>¿Cómo conseguir un cupo?</h2>
            <h3>Solicitá tu viaje a la Night City</h3>
            <br>
            <form action="#" method="post" id="formulario">
                <div class="container">

                    <!-- tarjeta izquierda -->
                    <div class="row g-4">

                        <div class="col-12 col-md-6">
                            <div class="card h-100">
                                <div class="card-body">
                                    <h3>Información personal y medio de contacto</h3>
                                    <div class="mb-3">
                                        <label for="nombre" class="form-label">Nombre y apellido</label>
                                        <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ingresar tu nombre y apellido" required>
                                    </div>
                                    <br>
                                    <div class="mb-3">
                                        <label for="email" class="form-label">Correo electrónico</label>
                                        <input type="email" class="form-control" id="email" name="email" placeholder="Ingresar tu correo electrónico" required>
                                    </div>
                                    <br>
                                    <div class="mb-3">
                                        <label for="cumpleanios" class="form-label">Fecha de nacimiento</label>
                                        <input type="date" class="form-control" name="cumpleanios" id="cumpleanios" required>
                                    </div>
                                    <br>
                                    <div class="mb-3">
                                        <label for="telefono" class="form-label">Teléfono</label>
                                        <input type="tel" class="form-control" name="telefono" id="telefono" placeholder="+1122334455" required>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- tarjeta derecha -->
                        <div class="col-12 col-md-6">
                            <div class="card h-100">
                                <div class="card-body">
                                    <h3>Información del viaje</h3>
                                    <div class="mb-3">
                                        <label for="fecha" class="form-label">Fecha de viaje</label>
                                        <input type="date" class="form-control" id="fecha" name="fecha">
                                    </div>
                                    <br>
                                    <div class="mb-3">
                                        <label for="dias" class="form-label">Cantidad de días</label>
                                        <input type="number" class="form-control" id="dias" name="dias" min="1">
                                    </div>
                                    <br>
                                    <div class="mb-3">
                                        <label for="personas" class="form-label">Cantidad de pasajeros</label>
                                        <input type="number" class="form-control" id="personas" name="personas" min="1">
                                    </div>
                                    <br>
                                    <div class="mb-3">
                                        <label for="distrito" class="form-label">Distrito a visitar</label>
                                        <select name="distrito" id="distrito" class="form-select" required>
                                            <option value="">Elegí un distrito</option>
                                            <option value="watson">Watson</option>
                                            <option value="westbrook">Westbrook</option>
                                            <option value="heywood">Heywood</option>
                                            <option value="pacifica">Pacifica</option>
                                        </select>
                                    </div>
                                    <br>
                                    <div class="mb-3">
                                        <label for="distrito" class="form-label">Disponibilidad para viajar</label>
                                        <select name="turno" id="turno" class="form-select" required>
                                            <option value="">Eleji tu disponibilidad</option>
                                            <option value="ma">Mañana</option>
                                            <option value="ta">Tarde</option>
                                            <option value="no">Noche</option>
                                        </select>  
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                    <br>

                    <!-- tarjeta inferior -->
                    <div class="row mt-4">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-body">
                                    <label for="mensaje" class="form-label">Dejanos tu consulta</label>
                                    <textarea name="mensaje" id="mensaje" rows="4" class="form-control" placeholder="Contanos qué te gustaría conocer de Night City"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <br>
                <!-- boton -->
                <div class="row mt-4">
                    <div class="col-12 text-center">
                        <button type="submit" class="btn btn-info btn-lg">
                            Enviar solicitud
                        </button>
                    </div>
                </div>
            </form>
        </main>
        <footer>
            <small>Night City - El futuro está lleno de luces de neón. <br>
                Arasaka© 1916
        </small>
    </footer>

    </body>
</html>
