        <main>
        <h2>Como conseguir un cupo</h2>
        <br>
        <form action="#" method="post">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre y Apellido"
             required>
            <br>
            <label for="email">Correo electronico</label>
            <input type="email" name="email" id="email" required placeholder="tu@correo.com">
            <br>
            <label for="cumpleanios">Cuando Naciste?</label>
            <input type="date" name="cumpleanios" id="cumpleanios">
            <br>
            <label for="edad">Edad</label>
            <input type="number" name="edad" id="edad">
            <br>
            <label for="telefono">Telefono</label>
            <input type="tel" name="telefono" id="telefono" placeholder="+1122334455">
            <select name="programa" id="programa" required>
                <option value="">Eleji tu programa</option>
                <option value="ad">Abuelas Digitales</option>
                <option value="jp">Jovenes Digitales</option>
                <option value="mi">Mujeres Internautas</option>
            </select>
            <br>
            <select name="turno" id="turno">
                <option value="">Eleji tu disponibilidad</option>
                <option value="ma">Mañana</option>
                <option value="ta">Tarde</option>
                <option value="no">Noche</option>
            </select>
            <br>
            <label for="mensaje"> Dejanos tus comentarios</label>
            <textarea name="mensaje" id="mensaje" rows="4" placeholder="Queremos saber tus sugerencias"></textarea>
            <br>
            <button type="submit">Enviar</button>

        </form>

</body>
